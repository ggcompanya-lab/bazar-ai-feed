name: Build and deploy Bazar AI Feed

on:
  push:
    branches: [main]
    paths:
      - "products.json"
      - "category_registry.json"
      - "build_feed.py"
      - "preflight.py"
      - "verify_feed.py"
      - "test_feed.py"
      - "index.html"
      - "media_config.json"
      - "check_media_access.py"
      - "images/**"
      - ".github/workflows/build-feed.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved inventory
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run catalog safety tests
        run: python -m unittest -v test_feed.py
      - name: Validate approved inventory
        run: python preflight.py
      - name: Generate approved XML
        run: python build_feed.py
      - name: Validate XML and original JPEG assets
        run: python verify_feed.py
      - name: Check independent image host availability
        continue-on-error: true
        run: python check_media_access.py
      - name: Prepare public site only
        run: |
          mkdir -p _site
          cp index.html feed.xml .nojekyll _site/
          cp -R images _site/images
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified product feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
